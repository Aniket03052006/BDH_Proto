<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDH | Neural Inference Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png" type="image/png">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="app">
        <!-- Sidebar: Chat -->
        <aside id="chat-zone">
            <div class="chat-header">
                <div class="brand">
                    <div class="brand-icon">
                        <img src="icon.png" alt="BDH Logo" style="width: 100%; height: 100%; object-fit: contain;">
                    </div>
                    <h2>Neural Explorer</h2>
                </div>
                <div class="controls-top">
                    <button id="reset-btn" title="Clear Session">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="1 4 1 10 7 10" />
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                        </svg>
                    </button>
                    <button id="reset-cache-btn" class="danger" title="Reset Global Cache">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="chat-history">
                <div class="chat-welcome">
                    <div class="welcome-orb">
                        <div class="orb-ring"></div>
                        <img src="icon.png" class="orb-core" alt="Neural Core">
                    </div>
                    <h3 class="welcome-title">Neural Explorer</h3>
                    <p class="welcome-desc">Type a concept or prompt to see how neurons fire and form memory patterns in
                        real-time.</p>
                    <div class="welcome-chips">
                        <button class="chip" data-prompt="The meaning of life">The meaning of life</button>
                        <button class="chip" data-prompt="How does memory work">How does memory work</button>
                        <button class="chip" data-prompt="Once upon a time">Once upon a time</button>
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <input type="text" id="chat-input" placeholder="Type a concept..." autocomplete="off">
                <button id="send-btn" title="Send">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main: Neural Sphere -->
        <main id="viz-zone">
            <div id="loading-overlay">
                <div class="loader-spinner"></div>
                Initializing 16,384 Neurons...
            </div>
            <div id="canvas-container"></div>

            <!-- Status bar -->
            <div id="viz-info">
                <span class="status-dot"></span>
                <span id="fps-counter">Connecting...</span>
                <span class="neuron-count">16,384 neurons</span>
            </div>

            <!-- Viz Controls -->
            <div id="viz-controls">
                <button id="zoom-in-btn" title="Zoom In">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        <line x1="11" y1="8" x2="11" y2="14" />
                        <line x1="8" y1="11" x2="14" y2="11" />
                    </svg>
                </button>
                <input type="range" id="zoom-slider" min="8" max="80" value="25" orient="vertical">
                <button id="zoom-out-btn" title="Zoom Out">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        <line x1="8" y1="11" x2="14" y2="11" />
                    </svg>
                </button>
                <div class="control-divider"></div>
                <button id="freeze-btn" title="Pause Globe">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="6" y="4" width="4" height="16" />
                        <rect x="14" y="4" width="4" height="16" />
                    </svg>
                </button>
                <button id="auto-rotate-btn" title="Auto Rotate">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10" />
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                    </svg>
                </button>
                <button id="reset-view-btn" title="Reset View">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    </svg>
                </button>
                <button id="top-view-btn" title="Top View">T</button>
                <button id="side-view-btn" title="Side View">S</button>
            </div>
        </main>

        <!-- Details Panel -->
        <footer id="details-zone">
            <div class="details-content">
                <div id="no-selection" class="empty-state">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        opacity="0.4">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M8 12h8M12 8v8" />
                    </svg>
                    <span>Click a neuron to inspect</span>
                </div>
                <div id="neuron-details" class="hidden">
                    <div class="detail-item">
                        <label>Neuron</label>
                        <span id="detail-id" class="detail-value">#0</span>
                    </div>
                    <div class="detail-item">
                        <label>Memory</label>
                        <div class="strength-bar-bg">
                            <div id="detail-memory-bar" class="strength-bar-fill"></div>
                        </div>
                        <span id="detail-memory-val" class="detail-value">0.0000</span>
                    </div>
                    <div class="detail-item">
                        <label>Status</label>
                        <span id="detail-status" class="status-badge">Dormant</span>
                    </div>
                    <div class="detail-item">
                        <label>Top Tokens</label>
                        <div id="detail-top-tokens" class="top-tokens-container">
                            <span class="top-token-empty">—</span>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
